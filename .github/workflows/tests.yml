name: GemMO Tests
on:
  push:
    branches: [ main, "attack-gemology-attunements-20260925" ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/abilities.cjs
      - run: node server/test.cjs
