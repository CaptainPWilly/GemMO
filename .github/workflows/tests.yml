name: geMMO Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/abilities.cjs
      - run: npm install --omit=dev
        working-directory: server
      - name: Smoke test Turso driver API
        working-directory: server
        run: node -e "import('@tursodatabase/serverless').then(({connect})=>{const db=connect({url:'https://example.invalid',authToken:'test'});if(typeof db.prepare!=='function'||typeof db.transaction!=='function'||typeof db.batch!=='function')process.exit(1)})"
      - run: node server/test.cjs
