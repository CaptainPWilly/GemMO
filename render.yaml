services:
  - type: web
    name: gemmo
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.cjs
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMMO_ORIGIN
        value: https://captainpwilly.github.io
      - key: TRUST_PROXY
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_EXPECTED_HOSTNAME
        value: captainpwilly.github.io
